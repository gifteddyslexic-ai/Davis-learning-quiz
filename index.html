<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Davis Learning Needs Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Davis Facilitator brand: purple band header with white logo, white page, purple headings,
   turquoise accents, Poppins Light body / Poppins Bold headings, purple footer bar with tagline.
   Single brand theme by choice (the brand is purple on white). */
:root{
  --purple:#592D91; --purple-deep:#45216F; --turq:#3BE8F8; --turq-soft:#D9F9FD;
  --offwhite:#F1F2F2; --bg:#F6F5F9; --white:#FFFFFF; --ink:#1E1730; --muted:#5E5873; --line:#E1DDEA;
  --sun:#3BE8F8;
  --head:"Poppins", "Segoe UI", system-ui, sans-serif;
  --body:"Poppins", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--purple)}
b,strong{font-weight:600}
.band{background:var(--purple);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.band-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:14px}
.band img{height:36px;width:auto;margin-left:-6px}
@media (min-width:600px){.band img{height:46px}}
.band .rail{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.band .rail i{display:block;height:100%;background:var(--turq);border-radius:99px;transition:width .35s ease}
.band .count{font-size:13px;color:#fff;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-weight:400}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
@media (min-width:600px){.page{padding-block:28px 40px}}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.nav{display:flex}
.back{background:none;border:0;color:var(--purple);font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}
.back[hidden]{display:none}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;color:var(--purple);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px} h4{font-size:16px}
@media (min-width:600px){h1{font-size:38px} h2{font-size:28px} h3{font-size:19px} h4{font-size:17px}}
.sub{color:var(--muted);margin:0;max-width:62ch}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .3s ease}
.actions{position:sticky;bottom:0;z-index:5;margin-inline:-4px;padding:12px 4px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(246,245,249,0),var(--bg) 35%)}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.band .rail i{transition:none}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;background:var(--white);color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:12px 14px;-webkit-tap-highlight-color:transparent;font:inherit;font-weight:400;cursor:pointer;transition:border-color .15s,background .15s}
@media (hover:hover){.opt:hover{border-color:var(--purple)}}
.opt:active{transform:scale(.99)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--purple);background:#F1EBF8}
.box{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;background:#fff}
.single .box{border-radius:50%}
.opt[aria-pressed="true"] .box{background:var(--purple);border-color:var(--purple)}
.opt[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--turq);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.single .opt[aria-pressed="true"] .box::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--turq);transform:none}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:var(--purple);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--purple);color:#fff;border:0;border-radius:99px;padding:16px 22px;min-height:54px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;width:100%}
.btn:hover{background:var(--purple-deep)}
.btn:disabled{opacity:.4;cursor:default}
.btn.turq{background:var(--turq);color:var(--purple-deep)}
.btn.ghost{background:transparent;color:var(--purple);border:2px solid var(--purple)}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
/* Encouragement screens borrow the Davis testimonial template: turquoise speech bubble on purple */
.cheer{background:var(--purple);border-radius:20px;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px;color:#fff}
.cheer .kick{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--turq)}
.tick{width:24px;height:24px;border-radius:50%;background:var(--turq);position:relative;flex:none}
.tick::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:12px;border:solid var(--purple);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.bubble{background:var(--turq);color:var(--purple-deep);border-radius:16px;padding:20px;position:relative;display:flex;flex-direction:column;gap:10px}
.bubble::after{content:"";position:absolute;left:30px;bottom:-18px;border-width:18px 18px 0 0;border-style:solid;border-color:var(--turq) transparent transparent transparent}
.bubble .big{font-family:var(--head);font-weight:700;font-size:19px;line-height:1.25;color:var(--purple)}
.bubble p{margin:0;font-weight:400}
.hero{background:var(--purple);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 56px;color:#fff}
@media (min-width:600px){.hero{grid-template-columns:minmax(0,1fr) 120px}}
.hero-txt{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.hero h1{color:#fff}
.hero p{margin:0;color:#EDE6F7}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--turq-soft);color:var(--purple-deep);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:400}
.hero .chip{background:rgba(255,255,255,.14);color:#fff}
label{font-weight:400;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-weight:400;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.form{display:flex;flex-direction:column;gap:14px}
.err{color:#B3261E;font-size:14px;margin:0;font-weight:400}
.tiny{font-size:12.5px;color:var(--muted);margin:0}
/* results */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar b{font-weight:400}
.bar em{font-style:normal;font-size:13px;color:var(--muted)}
.bar .track{grid-column:1/-1;height:10px;background:var(--offwhite);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;background:#B6A4D2}
.bar.mid .track i{background:var(--purple)}
.bar.high .track i{background:linear-gradient(90deg,var(--purple),var(--turq))}
.ind{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.ind-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ind p{margin:0}
.ind .why{background:var(--turq-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.ind .why b{color:var(--purple)}
.pill{font-size:12.5px;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--offwhite);color:var(--muted)}
.pill.strong{background:var(--purple);color:#fff}
.prog{border-left:4px solid var(--turq);padding:2px 0 2px 14px}
.prog p{margin:4px 0 0;color:var(--muted)}
/* timeline */
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.glance.wide{grid-template-columns:repeat(4,minmax(0,1fr))}
.gl{background:var(--offwhite);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gl span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.gl b{font-size:16px;color:var(--purple);font-weight:700;line-height:1.25}
.gl small{font-size:13px;color:var(--muted)}
.tl{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px}
.dotcol{display:flex;flex-direction:column;align-items:center}
.dot{width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.step.big .dot{background:var(--turq);color:var(--purple-deep)}
.line{width:3px;flex:1;background:var(--line);margin:4px 0;min-height:16px}
.step:last-child .line{display:none}
.sbody{padding:4px 0 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.shead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.when{font-size:12.5px;font-weight:600;color:var(--purple);background:var(--turq-soft);border-radius:99px;padding:2px 10px}
.dur{font-weight:600;font-size:14.5px}
.sbody p{margin:0;color:var(--muted);font-size:14.5px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{font-size:12px;border:1.5px solid var(--purple);color:var(--purple);border-radius:99px;padding:1px 9px;font-weight:600}
.pages{display:flex;flex-direction:column;gap:12px;background:var(--offwhite);border-radius:12px;padding:12px;max-height:70vh;overflow-y:auto}
.pages img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 10px rgba(69,33,111,.18)}
.pageph{display:flex;align-items:center;justify-content:center;gap:10px;min-height:160px;color:var(--purple);font-weight:400;text-align:center}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600;color:var(--purple)}
pre{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-family:var(--body);font-size:13px;margin:12px 0 0;max-height:280px;overflow:auto}
.status{font-size:14px;color:var(--purple);margin:0;font-weight:400;text-align:center}
footer{background:var(--purple);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:600px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-size:13px}
footer b{font-weight:700}
footer a{color:var(--turq);text-decoration:none}
/* offscreen stage for building the PDF */
#stage{position:fixed;left:-12000px;top:0;background:#fff}
#stage .blk{width:714px;background:#fff;padding:10px 0;display:flex;flex-direction:column;gap:12px}
#stage .full{width:794px}
/* PDF cover follows the Davis event template: purple left bar, photo panel, logo top right, purple Bold title */
.dlogo{display:flex;align-items:center;gap:10px}
.dlogo img{height:42px;width:auto}
.dlogo span{font-family:var(--head);font-weight:700;font-size:38px;line-height:1;color:var(--purple);letter-spacing:-.01em}
.dlogo sup{font-size:12px;font-weight:600;vertical-align:top;position:relative;top:4px}
.dlogo.white span{color:#fff}
.r-cover{display:grid;grid-template-columns:40px 300px minmax(0,1fr);min-height:440px;background:#fff}
.r-cover .bar{background:var(--purple)}
.r-cover .photo{background:var(--purple) center/cover no-repeat;margin:34px 0;border-radius:0 4px 4px 0}
.r-cover .photo.none{background:var(--turq-soft)}
.r-cover .t{padding:34px 40px 30px 32px;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:16px}
.r-cover h1{color:var(--purple);font-size:40px;line-height:1.08;margin-top:34px}
.r-cover .lead{margin:0;color:var(--purple);font-weight:600;font-size:15px}
.r-cover .meta{margin-top:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:14px}
.r-cover .tag{background:var(--purple);color:#fff;font-weight:700;border-radius:8px;padding:6px 14px;font-size:14px}
.r-head{background:#fff;padding:22px 40px 12px;border-bottom:3px solid var(--turq)}
.r-sec h3{display:flex;align-items:center;gap:10px}
.r-sec h3::before{content:"";width:22px;height:4px;border-radius:2px;background:var(--turq);flex:none}
.r-foot{background:var(--purple);color:#fff;padding:12px 40px;display:flex;justify-content:space-between;font-size:12px}
.r-foot b{font-weight:700}
.r-sec h3{font-size:22px}
</style>

/* Graded follow-ups: each one only appears when something in its area was ticked,
   and scales that area's score (every day counts more than rarely). */
const FREQ = [{l:'Every day',i:'calendar',m:1.5},{l:'A few times a week',i:'repeat',m:1.2},{l:'Now and then',i:'now',m:0.85},{l:'Rarely',i:'leaf',m:0.6}];

const grade = (id,areas,q,opts)=>({id, type:'single', grades:areas, q, options:opts, skip:()=>areas.every(a=>signs(a)===0)});
const GRADE_OF = {};
function insertAfter(anchor,...items){
  const i=screens.findIndex(s=>s.id===anchor);
  screens.splice(i+1,0,...items);
  items.forEach(s=>(s.grades||[]).forEach(a=>GRADE_OF[a]=s.id));
}

  {id:'solutions', type:'single', q:'How often do they come up with unique or unexpected solutions to problems?', options:[

const state = {i:0, a:{}, contact:{}};
const app = document.getElementById('app');
const qScreens = screens.filter(s=>s.id);
const val = x=>typeof x==='function'?x():x;
const pick = id=>(state.a[id]||[])[0];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function signs(id){ const s=screens.find(x=>x.id===id); return (state.a[id]||[]).filter(i=>!s.options[i].none).length; }
function label(id){ const s=screens.find(x=>x.id===id); return (state.a[id]||[]).map(i=>s.options[i].l); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function progress(){
  const s = screens[state.i];
  const live = qScreens.filter(x=>!(x.skip && val(x.skip)));
  const done = screens.slice(0,state.i).filter(x=>live.includes(x)).length;
  document.getElementById('rail').style.width = (s.type==='results'?100:Math.round(done/live.length*100))+'%';
  document.getElementById('count').textContent = s.id ? (done+1)+' / '+live.length : '';
  document.getElementById('back').hidden = state.i===0 || s.type==='results';
}
function go(n,dir){
  dir = dir || (n>=state.i?1:-1);
  n = Math.max(0,Math.min(screens.length-1,n));
  while(screens[n].skip && val(screens[n].skip)) n+=dir;
  state.i=n; render(); window.scrollTo(0,0);
}
document.getElementById('back').onclick = ()=>go(state.i-1,-1);

function render(){
  progress();
  const s = screens[state.i]; app.innerHTML='';
  const box = el('<section class="screen"></section>'); app.appendChild(box);
  if(s.type==='intro'){
    box.innerHTML = `<div class="hero"><div class="hero-txt">
        <h1>Find out what's really behind the struggle</h1>
        <p>Answer some quick questions about reading, spelling, maths, focus, coordination and confidence. You'll get a personal report showing the areas to explore, which Davis<sup>®</sup> programme may fit, and what the journey involves.</p>
        <div class="chips"><span class="chip">About 5 minutes</span><span class="chip">Children and adults</span><span class="chip">Free PDF report</span></div>
      </div><div class="dshape" aria-hidden="true"></div></div>
      <div class="actions"><button class="btn" id="start">Start the quiz</button></div>
      <p class="tiny">This quiz is not a diagnosis. It helps a Davis Facilitator understand your situation before a free consultation.</p>`;
    box.querySelector('#start').onclick=()=>go(1); return;
  }
  if(s.type==='info'){
    box.innerHTML = `<div class="cheer"><div class="kick"><span class="tick" aria-hidden="true"></span>${esc(val(s.kick))}</div>
      <div class="bubble"><div class="big">${esc(val(s.big))}</div><p>${esc(val(s.body))}</p></div></div>
      <div class="actions"><button class="btn">Continue</button></div>`;
    box.querySelector('.btn').onclick=()=>go(state.i+1); return;
  }
  if(s.type==='contact') return renderContact(box);
  if(s.type==='results') return renderResults(box);

  const multi = s.type==='multi';
  const sel = new Set(state.a[s.id] || []);
  box.innerHTML = `<h2>${esc(s.q)}</h2>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:''}<div class="opts ${multi?'multi':'single'}"></div>`;
  const opts = box.querySelector('.opts');
  let cont;
  s.options.forEach((o,idx)=>{
    const b = el(`<button class="opt" aria-pressed="${sel.has(idx)}"><span class="box"></span>${o.i?icon(o.i):''}<span>${esc(o.l)}</span></button>`);
    b.onclick=()=>{
      if(!multi){ state.a[s.id]=[idx]; opts.querySelectorAll('.opt').forEach((x,j)=>x.setAttribute('aria-pressed',j===idx)); setTimeout(()=>go(state.i+1),160); return; }
      if(o.none){ sel.clear(); sel.add(idx); }
      else { sel.has(idx)?sel.delete(idx):sel.add(idx); s.options.forEach((x,j)=>{ if(x.none) sel.delete(j); }); }
      state.a[s.id]=[...sel];
      opts.querySelectorAll('.opt').forEach((x,j)=>x.setAttribute('aria-pressed',sel.has(j)));
      cont.disabled = sel.size===0;
    };
    opts.appendChild(b);
  });
  if(multi){
    const bar = el('<div class="actions"><button class="btn">Continue</button></div>'); cont = bar.firstChild; cont.disabled = sel.size===0;
    cont.onclick=()=>go(state.i+1); box.appendChild(bar);
  }
}

function renderContact(box){
  const c = state.contact;
  box.innerHTML = `<h2>Your report is ready</h2>
    <p class="sub">Tell us who it's for. A Davis Facilitator will look over your answers before your free consultation.</p>
    <form class="form" id="f" novalidate>
      <label for="cName">Your first name<input id="cName" autocomplete="given-name" value="${esc(c.name||'')}"></label>
      <label for="cLearner">Learner's first name (optional)<input id="cLearner" value="${esc(c.learner||'')}"></label>
      <label for="cEmail">Email<input id="cEmail" type="email" autocomplete="email" value="${esc(c.email||'')}"></label>
      <label for="cPhone">Phone (optional)<input id="cPhone" type="tel" autocomplete="tel" value="${esc(c.phone||'')}"></label>
      <label for="cPref">Best way to reach you<select id="cPref"><option>Email</option><option>Phone call</option><option>Text or WhatsApp</option></select></label>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="submit">See my results</button>
      <p class="tiny">We only use your details to contact you about your enquiry.</p>
    </form>`;
  if(c.pref) box.querySelector('#cPref').value=c.pref;
  box.querySelector('#f').addEventListener('submit',e=>{
    e.preventDefault();
    const v=id=>box.querySelector('#'+id).value.trim();
    Object.assign(c,{name:v('cName'),learner:v('cLearner'),email:v('cEmail'),phone:v('cPhone'),pref:v('cPref')});
    const err=box.querySelector('#err');
    if(!c.name){err.textContent='Please add your first name.';err.hidden=false;return;}
    if(!/^\S+@\S+\.\S+$/.test(c.email)){err.textContent='Please enter an email address like name@example.com.';err.hidden=false;return;}
    go(state.i+1);
  });
}

function score(){
  const t={r:0,s:0,g:0,m:0,a:0,c:0,e:0,so:0,gift:0,fam:0,sport:false,sensory:false,dx:{}};
  const mult=id=>{ const gs=screens.find(x=>x.id===GRADE_OF[id]); const p=gs&&!val(gs.skip)?pick(gs.id):undefined; return p===undefined?1:gs.options[p].m; };
  qScreens.forEach(s=>{ if(s.skip && val(s.skip)) return; const k0=mult(s.id); (state.a[s.id]||[]).forEach(i=>{
    const o=s.options[i]; if(o.w) for(const k in o.w) t[k]+=o.w[k]*k0;
    if(o.dx){ t[o.dx]+=3; t.dx[o.dx]=true; }
    if(o.sport) t.sport=true; if(o.sensory) t.sensory=true;
  });});
  return t;
}

/* Build everything the results page and the PDF share */
function analyse(){
  const t=score(), c=state.contact, ageIdx=pick('age');
  const adult = pick('who')===1 || ageIdx===3;
  const young = ageIdx===0 && !adult;
  const areas=[
    {k:'r',n:'Reading',max:12},{k:'s',n:'Spelling and writing',max:11},{k:'g',n:'Handwriting',max:11},{k:'m',n:'Maths and time',max:10},
    {k:'a',n:'Focus and attention',max:12},{k:'c',n:'Orientation and coordination',max:12},
    {k:'e',n:'Confidence and emotions',max:7},{k:'so',n:'Social and autistic traits',max:18}];
  const lvl=p=>p>=.5?'Strong sign':p>=.2?'Some signs':'Few signs';
  const bars=areas.map(a=>({...a,p:Math.min(1,t[a.k]/a.max)}));
  const lit=t.r+t.s;
  const ind=[];
  if(lit>=4) ind.push({n:'Dyslexia', s:lit>=8||t.dx.r,
    what:'Guessing at words, tripping over small words, losing the place and inconsistent spelling are a pattern often seen with dyslexia.',
    why:'Davis treats this as a picture thinker\'s way of learning. Orientation tools stop letters and words seeming to move, and modelling letters and abstract words like "the" in clay gives them a picture, so they stop causing confusion.'});
  if(t.g>=4) ind.push({n:'Dysgraphia', s:t.g>=7,
    what:'An awkward or tight grip, a hand that tires quickly, uneven letters and slow, laboured copying are a pattern often seen with dysgraphia. It is common for a learner to have rich ideas out loud that get lost on the way to the page.',
    why:'Davis orientation helps steady fine motor control, and modelling each letter in clay gives a clear mental picture of its shape, so the hand knows what to form. As words gain meaning through Davis Symbol Mastery, writing them down takes far less effort.'});
  if(t.m>=4) ind.push({n:'Dyscalculia', s:t.m>=7||t.dx.m,
    what:'Difficulty with times tables, telling the time and keeping steps in order often points to dyscalculia or gaps in the basic concepts behind maths.',
    why:'Davis Math Mastery builds those concepts first, such as change, time, sequence and order, using clay. Once the foundation makes sense, number facts and procedures stick far more easily.'});
  if(t.a>=5) ind.push({n:'Attention difficulties (ADHD / ADD)', s:t.a>=8||t.dx.a,
    what:'Daydreaming, restlessness, unfinished tasks and forgetting instructions are patterns often linked with ADHD or ADD.',
    why:'Davis focus tools give the learner a simple, reliable way to bring their attention back and calm down. Concept work on time, consequence and order builds self-regulation from the inside rather than through rules.'});
  if(t.c>=4) ind.push({n:'Dyspraxia', s:(t.c>=6&&t.sport)||t.dx.c,
    what:'Left/right confusion, clumsiness and trouble with fine motor tasks point towards dyspraxia'+(t.sport?', especially alongside avoiding sport and coordination games':'')+'. People with dyspraxia often have high emotional intelligence'+(t.sensory?' and, as your answers suggest, a strong sensitivity to sound, light, touch or other senses':' and can be very sensitive to sound, light or touch')+'.',
    why:'Davis orientation gives a stable mental reference point, which often improves balance and coordination quickly. Koosh ball exercises then train balance and hand-eye coordination in a playful, low-pressure way, and the calm one-to-one setting respects sensory sensitivity.'});
  if(t.so>=5) ind.push({n:'Autistic traits', s:t.so>=10||t.dx.so,
    what:'Taking words literally, finding eye contact or small talk hard, strong reactions to change, intense interests, stimming and needing time alone are traits often seen in autistic people. Many autistic people are also highly honest, loyal and deeply focused thinkers.'+(signs('traits')>=4?' You ticked several of these, so they are well worth exploring together.':''),
    why:'The Davis Autism Approach works step by step on identity, emotions and social understanding, at the individual\'s own pace, so the world becomes more predictable and easier to take part in.'});
  if(t.e>=3) ind.push({n:'A knock-on effect on confidence', s:t.e>=5,
    what:'Low confidence, frustration or anxiety are very common when a bright learner keeps struggling despite trying hard.',
    why:'Davis is one to one and builds on strengths, so most learners see clear progress within the first days. That early success is often the biggest change of all.'});

  const progs=[];
  if(lit>=3 || t.g>=4){
    if(young) progs.push(['Davis Reading Program for Young Learners','A gentle programme for 5 to 8 year olds that builds the basics of reading, letters and focus, in shorter sessions suited to their age.']);
    else progs.push(['Davis Dyslexia Correction Program','Usually five days of about six hours. Works on reading, spelling, writing and handwriting using focus tools, clay modelling of letters and trigger words, and reading exercises.']);
  } else if(t.c>=4){
    progs.push(['Davis orientation and coordination work','Davis orientation and Koosh ball exercises, which are part of the core Davis programme, target balance, coordination and left/right confusion.']);
  }
  if(t.m>=3) progs.push(['Davis Math Mastery','Builds the foundation concepts behind numbers, such as change, time, sequence and order, so maths starts to make sense.']);
  if(t.a>=4) progs.push(['Davis Attention Mastery','Helps with focus, self-regulation and understanding how behaviour affects others, using hands-on concept work.']);
  if(t.so>=5) progs.push(['Davis Autism Approach','A step-by-step programme for identity, social understanding and coping with change, at the individual\'s own pace.']);
  if(!progs.length) progs.push(['A free consultation','Your answers show only a few signs. A short conversation with a facilitator is the best way to see whether Davis is the right fit.']);

  const top=bars.filter(b=>b.p>=.2).sort((x,y)=>y.p-x.p).slice(0,3).map(b=>b.n.toLowerCase());
  const strengths=label('strengths');
  const lead=(top.length?`The clearest signs are in ${top.join(', ').replace(/, ([^,]*)$/,' and $1')}.`:'Your answers show only a few signs of difficulty.')
    +(t.gift>=3?' Your answers also describe a fast, original thinker who finds unexpected solutions, which is typical of gifted picture thinkers.':'')
    +(strengths.length?` We also noticed real strengths: ${strengths.slice(0,3).map(x=>x.charAt(0).toLowerCase()+x.slice(1)).join(', ')}. Davis work builds on exactly these.`:'');
  const parentNote = t.fam>=1 ? (t.fam>=2
    ? 'You told us you often feel like you are running on empty. That is completely understandable. Davis works one to one with your child during the programme, and you learn simple tools that many parents say make homework and daily routines far calmer.'
    : 'You told us supporting your child can be tiring at times. The Davis tools you learn in the final 3 hours of the programme are designed to make home practice short, calm and positive for both of you.') : '';
  return {t,c,adult,young,bars,lvl,ind,progs,lead,strengths,parentNote};
}

/* Timeline and commitment, worded for a parent and child or for an adult */
function journey(A){
  const kid = A.c.learner || 'your child';
  const Kid = kid.charAt(0).toUpperCase()+kid.slice(1);
  if(A.adult) return {
    glance:[['Programme','About 30 hours','5 days, one to one'],['Daily reading','10 minutes a day','For the first few weeks'],['Home follow-up','About 1 hour a week','Over roughly a year'],['Follow-up sessions','6 hours included','With your facilitator']],
    steps:[
      {t:'Free consultation',when:'Before you start',dur:'30 to 60 minutes',who:['You'],d:'A relaxed conversation about your goals and history, so your facilitator can check that a Davis programme is right for you.'},
      {t:'Programme week',when:'Week 1',dur:'5 days, about 6 hours a day',who:['You'],big:true,d:'One-to-one sessions with your facilitator. You learn the Davis focus tools and begin mastering words and concepts in clay.'},
      {t:'Support training',when:'Final 3 hours of the programme',dur:'3 hours',who:['You','Support person (optional)'],d:'You review the tools so you can carry on by yourself. A partner or friend is welcome to join and learn how to support you.'},
      {t:'Daily reading exercises',when:'First few weeks',dur:'About 10 minutes a day',who:['You'],d:'Short reading exercises using material you already read, such as work documents or a book you enjoy.'},
      {t:'Home follow-up',when:'Over roughly a year',dur:'About 1 hour a week',who:['You'],d:'Regular practice, mostly modelling the remaining trigger words in clay, so the progress keeps growing and becomes lasting.'},
      {t:'Follow-up sessions',when:'During the year',dur:'6 hours included',who:['You','Facilitator'],d:'Sessions with your facilitator to check progress, answer questions and help with any bumps along the way.'}]};
  return {
    glance:[[Kid+'\'s programme',A.young?'Shorter sessions':'About 30 hours',A.young?'Spread over more days':'5 days, one to one'],['Your time as parent','Consultation and final 3 hours','Welcome to sit in on the programme'],['Home follow-up','About 1 hour a week','Over roughly a year'],['Follow-up sessions','6 hours included','With the facilitator']],
    steps:[
      {t:'Free consultation',when:'Before you start',dur:'30 to 60 minutes',who:['Parent'],d:'A conversation with you about '+kid+'\'s needs, strengths and history, so the facilitator can check that a Davis programme is the right fit.'},
      {t:A.young?'Programme sessions':'Programme week',when:A.young?'Weeks 1 to 2':'Week 1',dur:A.young?'Shorter daily sessions suited to their age':'5 days, about 6 hours a day',who:[Kid,'Parent (optional)'],big:true,d:'One-to-one sessions with the facilitator, using focus tools, clay modelling and hands-on exercises. You are welcome to sit in, or simply drop off and collect.'},
      {t:'Support training',when:'Final 3 hours of the programme',dur:'3 hours',who:['Parent',Kid],d:'You join the last part of the programme to learn the Davis tools and how to support '+kid+' at home.'},
      {t:'Daily reading exercises',when:'First few weeks',dur:'About 10 minutes a day',who:[Kid,'Parent'],d:'Short reading exercises together, normally using homework the school already sets, so there is no extra workload.'},
      {t:'Home follow-up',when:'Over roughly a year',dur:'About 1 hour a week',who:[Kid,'Parent'],d:'Regular practice together, mostly modelling the remaining trigger words in clay. This is where the progress becomes lasting.'},
      {t:'Follow-up sessions',when:'During the year',dur:'6 hours included',who:[Kid,'Facilitator'],d:'Sessions with the facilitator to check progress, answer questions and help with any bumps along the way.'}]};
}
const glanceHTML=J=>`<div class="glance">${J.glance.map(g=>`<div class="gl"><span>${esc(g[0])}</span><b>${esc(g[1])}</b><small>${esc(g[2])}</small></div>`).join('')}</div>`;
const stepHTML=(s,i,last)=>`<div class="step ${s.big?'big':''}"><div class="dotcol"><div class="dot">${i+1}</div>${last?'':'<div class="line"></div>'}</div>
      <div class="sbody"><div class="shead"><h4>${esc(s.t)}</h4><span class="when">${esc(s.when)}</span></div>
      <div class="dur">${esc(s.dur)}</div><p>${esc(s.d)}</p><div class="who">${s.who.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div></div>`;
function journeyHTML(J){
  return glanceHTML(J)+`<div class="tl">${J.steps.map((s,i)=>stepHTML(s,i,i===J.steps.length-1)).join('')}</div>`;
}
const barsHTML=A=>`<div class="bars">${A.bars.map(b=>`<div class="bar ${b.p>=.5?'high':b.p>=.2?'mid':''}"><b>${b.n}</b><em>${A.lvl(b.p)}</em><div class="track"><i style="width:${Math.max(4,Math.round(b.p*100))}%"></i></div></div>`).join('')}</div>`;
const indHTML=x=>`<div class="ind"><div class="ind-h"><h4>${esc(x.n)}</h4><span class="pill ${x.s?'strong':''}">${x.s?'Strong indication':'Possible'}</span></div>
  <p>${esc(x.what)}</p><p class="why"><b>Why Davis is likely to help:</b> ${esc(x.why)}</p></div>`;
const progsHTML=A=>A.progs.map(p=>`<div class="prog"><h4>${esc(p[0])}</h4><p>${esc(p[1])}</p></div>`).join('');
function contactLine(){
  const f=FACILITATOR; const bits=[f.name&&('Davis Facilitator '+f.name),f.email,f.phone,f.profile].filter(Boolean);
  return bits.join(' · ');
}

function summaryText(A,J){
  const c=A.c;
  return [
    'DAVIS LEARNING NEEDS QUIZ – SUMMARY',
    `Contact: ${c.name} | ${c.email}${c.phone?' | '+c.phone:''} | prefers ${c.pref}`,
    `For: ${label('who').join('')}${c.learner?' ('+c.learner+')':''}, age ${label('age').join('')}`,
    '',
    ...A.bars.map(b=>`${b.n}: ${A.lvl(b.p)}`),
    '',
    `May point to: ${A.ind.map(x=>x.n+(x.s?' (strong)':'')).join(', ')||'nothing specific'}`,
    '',
    `Reading: ${label('reading').join('; ')||'—'}`,
    `Spelling/writing: ${label('writing').join('; ')||'—'}`,
    `Handwriting: ${label('handwriting').join('; ')||'—'}`,
    `Maths: ${label('maths').join('; ')||'—'}`,
    `Attention: ${label('attention').join('; ')||'—'}`,
    `Physical/spatial: ${label('coord').join('; ')||'—'}`,
    `Day-to-day impact: ${label('feelings').join('; ')||'—'}`,
    `Everyday traits: ${label('traits').join('; ')||'—'}`,
    `Strengths: ${A.strengths.join('; ')||'—'}`,
    `Assessments: ${label('dx').join('; ')||'—'}`,
    `Already tried: ${label('tried').join('; ')||'—'}`,
    `How often / how strongly: ${['g_reading','g_writing','g_maths','g_attention','g_coord','g_traits'].filter(id=>!val(screens.find(x=>x.id===id).skip)&&pick(id)!==undefined).map(id=>({g_reading:'reading',g_writing:'writing',g_maths:'maths',g_attention:'focus',g_coord:'physical',g_traits:'traits'})[id]+' – '+label(id).join('')).join('; ')||'—'}`,
    `Unusual solutions: ${label('solutions').join('')||'—'} | Fast thinking: ${label('fast').join('')||'—'}`,
    ...(isAdultSelf()?[]:[`Energy in public: ${label('energy').join('')||'—'} | Meltdowns: ${label('meltdowns').join('')||'—'} | Parent feels drained: ${label('drained').join('')||'—'}`]),
    `Desired outcomes: ${label('goal').join('; ')||'—'}`,
    `Timing: ${label('urgency').join('')} | Format: ${label('format').join('')}`,
    '',
    `Possible fit: ${A.progs.map(p=>p[0]).join(', ')}`
  ].join('\n');
}

function renderResults(box){
  const A=analyse(), J=journey(A), c=A.c;
  const summary=summaryText(A,J);
  const who=c.learner||(A.adult?'you':'the learner');
  box.innerHTML = `<div class="cheer"><div class="kick"><span class="tick" aria-hidden="true"></span>Your results</div>
      <div class="bubble"><div class="big">Thanks, ${esc(c.name)}. Here's what your answers show.</div><p>${esc(A.lead)}</p></div></div>
    <div class="card report"><h3>Your Davis report</h3>
      <p class="sub" style="margin-top:-6px">A branded PDF you can keep, print or send to your Davis Facilitator.</p>
      <div class="pages" id="pages"><div class="pageph"><span class="spin" aria-hidden="true"></span>Preparing your report…</div></div>
      <button class="btn turq" id="pdf" disabled>Download my report (PDF)</button>
      <p class="status" id="pdfStatus" hidden></p></div>
    <div class="card"><h3>Areas to explore</h3>${barsHTML(A)}</div>
    ${A.ind.length?`<div class="card"><h3>What this may point to</h3><p class="tiny">A rough indication only. A Davis Facilitator will talk it through with you.</p>${A.ind.map(indHTML).join('')}</div>`:''}
    <div class="card"><h3>Programmes that may fit</h3>${progsHTML(A)}</div>
    ${A.parentNote?`<div class="card"><h3>A note for you</h3><p style="margin:0">${esc(A.parentNote)}</p></div>`:''}
    <div class="card"><h3>${A.adult?'Your journey and commitment':'The journey and what it asks of you both'}</h3>
      <p class="sub" style="margin-top:-6px">${A.adult?'What a typical Davis programme looks like for an adult.':'What a typical Davis programme looks like for '+esc(c.learner||'your child')+' and for you as a parent.'}</p>
      ${journeyHTML(J)}</div>
    <div class="cheer"><div class="kick"><span class="tick" aria-hidden="true"></span>Next step</div>
      <div class="bubble"><div class="big">Book your free consultation</div><p>Send your report to your Davis Facilitator so you can talk about ${esc(who)} in detail.${contactLine()?' '+esc(contactLine()):''}</p></div></div>
    <details><summary>Show my answers as text</summary><pre id="sum">${esc(summary)}</pre>
      <button class="btn ghost" id="copy" style="margin-top:12px">Copy my answers</button></details>
    <button class="btn ghost" id="redo">Start again</button>
    <p class="tiny">This quiz is a starting point for a conversation and is not a medical or educational diagnosis.</p>`;
  box.querySelector('#copy').onclick=async(e)=>{
    const b=e.currentTarget;
    try{ await navigator.clipboard.writeText(summary); b.textContent='Copied'; }
    catch{ const r=document.createRange(); r.selectNodeContents(box.querySelector('#sum')); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); b.textContent='Selected. Press Ctrl+C or Cmd+C'; }
  };
  box.querySelector('#redo').onclick=()=>{state.a={};go(0);};
  const pdfBtn=box.querySelector('#pdf'), st=box.querySelector('#pdfStatus'), pagesEl=box.querySelector('#pages');
  const fname='Davis report - '+(c.learner||c.name).replace(/[^\w ]+/g,'').trim()+'.pdf';
  let report=null;
  buildReport(A,J).then(r=>{
    report=r;
    pagesEl.innerHTML=r.previews.map((src,i)=>`<img src="${src}" alt="Report page ${i+1} of ${r.previews.length}">`).join('');
    pdfBtn.disabled=false;
  }).catch(()=>{
    pagesEl.innerHTML='<div class="pageph">The report preview could not be created in this view. Your results are shown above.</div>';
  });
  pdfBtn.onclick=async()=>{
    if(!report) return;
    pdfBtn.disabled=true; st.hidden=false; st.textContent='Opening the download…';
    try{
      const dl=await getDownloads();
      if(!dl){ st.textContent='Downloading isn\'t available in this view. Open the quiz in your browser to save the PDF.'; return; }
      await dl.save({filename:fname,data:report.blob});
      st.textContent='Your report has been saved.';
    }catch(err){
      const code=err&&err.code;
      st.textContent= code==='declined'?'Download cancelled. You can try again any time.'
        : code==='rate_limited'?'Please wait a moment, then try again.'
        : code==='unavailable'||code==='not_granted'?'Downloading isn\'t available in this view. Open the quiz in your browser to save the PDF.'
        : 'Something went wrong saving the PDF. Please try again.';
    }finally{ pdfBtn.disabled=false; }
  };
}

/* Wait for the viewer to provide the downloads capability (it may arrive after the page loads) */
async function getDownloads(){
  for(let i=0;i<30 && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use)) return null;
  try{ return await window.claude.use('downloads'); }catch{ return null; }
}

/* Report: each section is rendered to an image and flowed onto A4 page canvases with a Davis header and footer.
   The same pages are shown as a preview and assembled into the PDF. */
async function buildReport(A,J){
  if(!window.html2canvas || !window.jspdf) throw new Error('libs');
  try{ await document.fonts.ready; }catch{}
  const stage=document.getElementById('stage');
  const snap=async(html,full)=>{
    stage.innerHTML=`<div class="blk ${full?'full':''}" style="${full?'padding:0':''}">${html}</div>`;
    const node=stage.firstChild;
    await Promise.all([...node.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    return html2canvas(node,{scale:2,backgroundColor:'#ffffff',logging:false});
  };
  const c=A.c, today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const forWho=c.learner?`${c.learner}${A.adult?'':' · age '+label('age').join('')}`:label('who').join('');
  const hasPhoto = PHOTO.startsWith('data:');
  const cover=await snap(`<div class="r-cover"><div class="bar"></div>
      <div class="photo ${hasPhoto?'':'none'}" style="${hasPhoto?`background-image:url(${PHOTO})`:''}"></div>
      <div class="t">${davisLogo()}
        <h1>Learning Needs Report.</h1>
        <p class="lead">Understanding how ${esc(c.learner||(A.adult?'you':'your child'))} thinks and learns</p>
        <div class="meta"><span><b>Prepared for:</b> ${esc(c.name)}${forWho?' · '+esc(forWho):''}</span><span class="tag">${esc(today)}</span></div>
      </div></div>`,true);
  const head=await snap(`<div class="r-head">${davisLogo()}</div>`,true);
  const foot=await snap(`<div class="r-foot"><b>Transforming Learning &amp; Lives</b><span>davismethod.com</span></div>`,true);
  const blocks=[
    `<div class="r-sec"><h3>Summary</h3><p style="margin:8px 0 0">${esc(A.lead)}</p></div>`,
    `<div class="r-sec"><h3>Areas to explore</h3></div>${barsHTML(A)}`,
  ];
  if(A.ind.length){
    blocks.push(`<div class="r-sec"><h3>What this may point to</h3><p class="tiny" style="margin-top:4px">A rough indication only, not a diagnosis. A Davis Facilitator will talk it through with you.</p></div>`);
    A.ind.forEach(x=>blocks.push(indHTML(x)));
  }
  blocks.push(`<div class="r-sec"><h3>Programmes that may fit</h3></div>${progsHTML(A)}`);
  if(A.parentNote) blocks.push(`<div class="r-sec"><h3>A note for you</h3><p style="margin:8px 0 0">${esc(A.parentNote)}</p></div>`);
  blocks.push(`<div class="r-sec"><h3>${A.adult?'Your journey and commitment':'The journey and what it asks of you both'}</h3></div><div class="glance wide">${J.glance.map(g=>`<div class="gl"><span>${esc(g[0])}</span><b>${esc(g[1])}</b><small>${esc(g[2])}</small></div>`).join('')}</div>`);
  J.steps.forEach((s,i)=>blocks.push(`<div class="tl">${stepHTML(s,i,i===J.steps.length-1)}</div>`));
  blocks.push(`<div class="cheer" style="padding:20px"><div class="kick"><span class="tick"></span>Next step</div><div class="bubble"><div class="big">Book your free consultation</div><p>Share this report with your Davis Facilitator so you can talk about ${esc(c.learner||(A.adult?'your needs':'the learner'))} in detail.${contactLine()?' '+esc(contactLine()):''}</p></div></div>`);
  blocks.push(`<p class="tiny">This report is based on answers given in the Davis Learning Needs Quiz on ${esc(today)}. It is a starting point for a conversation and is not a medical or educational diagnosis.</p>`);

  const PW=210, PH=297, M=15, CW=PW-2*M, K=1588/PW;
  const hmm=cv=>cv.height/cv.width;
  const fh=PW*hmm(foot), hh=PW*hmm(head);
  const pages=[]; let ctx, y;
  const draw=(cv,x,yy,w)=>ctx.drawImage(cv,x*K,yy*K,w*K,w*hmm(cv)*K);
  const newPage=first=>{
    const p=document.createElement('canvas'); p.width=1588; p.height=Math.round(PH*K);
    ctx=p.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,p.width,p.height);
    pages.push(p); draw(foot,0,PH-fh,PW);
    if(first){ draw(cover,0,0,PW); y=PW*hmm(cover)+8; } else { draw(head,0,0,PW); y=hh+6; }
  };
  newPage(true);
  for(const html of blocks){
    const cv=await snap(html,false); const h=CW*hmm(cv);
    if(y+h>PH-fh-6) newPage(false);
    draw(cv,M,y,CW); y+=h+1;
  }
  stage.innerHTML='';
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  pages.forEach((p,i)=>{ if(i) pdf.addPage(); pdf.addImage(p.toDataURL('image/jpeg',0.9),'JPEG',0,0,PW,PH); });
  return {blob:pdf.output('blob'), previews:pages.map(p=>p.toDataURL('image/jpeg',0.8))};
}
render();
</script>

</body></html>
